<style>
/* =====================================================================
   PERSONALIZACIÓN — tocá solo estas variables
   ===================================================================== */
:root{
  /* Fondo */
  --bg-image: url("assets/fondo.jpg");   /* tu imagen de fondo (poné el archivo en /assets) */
  --bg-color-1: #041a3d;                 /* degradé de respaldo si no hay imagen: azul noche */
  --bg-color-2: #0b5cad;                 /* azul medio */
  --bg-color-3: #5ec8f2;                 /* celeste */
  --overlay: 0.35;                       /* oscurecer el fondo: 0 (nada) a 1 (negro) */
  --bg-blur: 0px;                        /* desenfoque del fondo, ej: 4px */

  /* Botones (transparencia = vidrio) */
  --btn-bg: rgba(214,238,255,.16);       /* el último número es la transparencia */
  --btn-bg-hover: rgba(214,238,255,.30);
  --btn-border: rgba(190,228,255,.45);
  --btn-blur: 14px;
  --btn-radius: 18px;

  /* Texto */
  --text: #f1f8ff;                       /* blanco azulado, no puro */
  --text-soft: rgba(226,242,255,.85);
  --accent: #8fe3ff;                     /* celeste brillante para resaltar */

  /* Tamaños */
  --card-width: 520px;
}

/* ===================================================================== */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  min-height:100%;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  display:flex;justify-content:center;align-items:flex-start;
  padding:max(28px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom));
  background:linear-gradient(135deg,var(--bg-color-1),var(--bg-color-2) 55%,var(--bg-color-3));
  background-attachment:fixed;
  overflow-x:hidden;
}
/* capa de fondo fija (imagen) */
.bg{
  position:fixed;inset:0;z-index:-2;
  background:var(--bg-image) center/cover no-repeat;
  filter:blur(var(--bg-blur));
  transform:scale(1.05); /* evita bordes con blur */
}
.bg::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,var(--overlay))}

.card{
  width:100%;max-width:var(--card-width);
  display:flex;flex-direction:column;align-items:center;
  text-align:center;
  animation:fadeUp .7s ease both;
}
.avatar{
  width:112px;height:112px;border-radius:50%;
  object-fit:cover;
  border:3px solid rgba(190,228,255,.8);
  box-shadow:0 8px 30px rgba(2,20,50,.55),0 0 0 6px rgba(143,227,255,.18);
  background:rgba(255,255,255,.15);
}
h1{margin-top:16px;font-size:clamp(1.7rem,5.5vw,2.2rem);letter-spacing:.5px;text-shadow:0 2px 12px rgba(0,0,0,.45)}
h1 span{color:var(--accent)}
.bio{margin-top:8px;max-width:420px;color:var(--text-soft);line-height:1.45;font-size:1rem;text-shadow:0 1px 8px rgba(0,0,0,.4)}

.links{margin-top:26px;width:100%;display:flex;flex-direction:column;gap:14px}
.btn{
  display:flex;align-items:center;gap:14px;
  width:100%;padding:15px 18px;
  color:var(--text);text-decoration:none;font-weight:600;font-size:1.05rem;
  background:var(--btn-bg);
  border:1px solid var(--btn-border);
  border-radius:var(--btn-radius);
  -webkit-backdrop-filter:blur(var(--btn-blur));backdrop-filter:blur(var(--btn-blur));
  box-shadow:0 6px 20px rgba(0,0,0,.22);
  transition:transform .18s ease,background .18s ease,box-shadow .18s ease;
  opacity:0;animation:fadeUp .6s ease forwards;
}
.btn:nth-child(1){animation-delay:.15s}
.btn:nth-child(2){animation-delay:.25s}
.btn:nth-child(3){animation-delay:.35s}
.btn:nth-child(4){animation-delay:.45s}
.btn:nth-child(5){animation-delay:.55s}
.btn:nth-child(6){animation-delay:.65s}
.btn:hover,.btn:focus-visible{background:var(--btn-bg-hover);transform:translateY(-3px) scale(1.015);box-shadow:0 12px 28px rgba(0,0,0,.32);outline:none}
.btn:active{transform:scale(.98)}
.ico{
  flex:0 0 42px;height:42px;border-radius:12px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.18);
}
.ico svg{width:24px;height:24px;fill:#fff}
.btn .label{flex:1;text-align:left}
.btn .sub{display:block;font-weight:400;font-size:.8rem;color:var(--text-soft);margin-top:2px}
.arrow{opacity:.7;font-size:1.2rem}

/* colores de marca en el icono */
/* iconos unificados en la paleta azul (si querés los colores originales de cada red:
   YouTube #ff0000, WhatsApp #25d366, Facebook #1877f2, cambiá los fondos acá) */
.yt .ico{background:linear-gradient(135deg,#1e7fd6,#0a4a9c)}
.wa .ico{background:linear-gradient(135deg,#4fc3f7,#1e88d6)}
.fb .ico{background:linear-gradient(135deg,#2f6fe0,#123a8f)}
.radio .ico{background:linear-gradient(135deg,#7ee0ff,#2aa3e6)}

footer{margin-top:30px;font-size:.78rem;color:var(--text-soft);opacity:.85;text-shadow:0 1px 6px rgba(0,0,0,.5)}

@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important;transition:none!important}}

/* PC: un poco más aire */
@media (min-width:768px){
  body{align-items:center;padding-top:40px;padding-bottom:40px}
  .avatar{width:132px;height:132px}
  .btn{padding:17px 22px}
}
</style>
</head>

  </nav>
